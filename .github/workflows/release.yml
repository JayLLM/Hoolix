name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write   # needed for npm provenance attestation

jobs:
  # ── Job 1: release-it (bump, CHANGELOG, tag, GitHub Release body) ───────────
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-it to create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "beta" ]; then
            bunx release-it --ci --preRelease=beta --github.preRelease=true
          else
            bunx release-it --ci --increment=${{ github.event.inputs.release_type }} --github.preRelease=false
          fi

      - name: Get released tag and version
        id: version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released: $TAG"

  # ── Job 2: cross-platform binary builds (matrix on native runners) ───────────
  build-binaries:
    needs: [prepare-release]
    if: needs.prepare-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            binary-name: hoolix-linux-x64
            ext: ''
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            binary-name: hoolix-linux-arm64
            ext: ''
          - runner: macos-14
            os: darwin
            arch: arm64
            binary-name: hoolix-darwin-arm64
            ext: ''
          - runner: windows-latest
            os: windows
            arch: x64
            binary-name: hoolix-windows-x64
            ext: '.exe'

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Type check (non-blocking)
        run: bun run typecheck || echo "Type issues (non-fatal)"
        continue-on-error: true

      - name: Compile binary
        shell: bash
        run: |
          set -e
          mkdir -p dist-bin
          OUT="dist-bin/${{ matrix.binary-name }}${{ matrix.ext }}"
          echo "Building $OUT"
          bun build --compile src/index.ts --minify --outfile "$OUT"
          ls -lh "$OUT" || true
          if [[ "${{ matrix.os }}" == "windows" && ! "$OUT" == *.exe && -f "dist-bin/${{ matrix.binary-name }}" ]]; then
            mv "dist-bin/${{ matrix.binary-name }}" "$OUT" || true
          fi

      - name: Quick smoke
        shell: bash
        run: |
          set -e
          BIN="./dist-bin/${{ matrix.binary-name }}${{ matrix.ext }}"
          if [[ ! -f "$BIN" && -f "dist-bin/${{ matrix.binary-name }}" ]]; then BIN="dist-bin/${{ matrix.binary-name }}"; fi
          chmod +x "$BIN" 2>/dev/null || true
          export MCP_PORTAL_DATA_DIR="${RUNNER_TEMP:-/tmp}/hoolix-release-smoke-${{ matrix.os }}-${{ matrix.arch }}"
          export MCP_PORTAL_SKIP_UPDATE_CHECK=1
          "$BIN" --version
          "$BIN" doctor --json || echo "(doctor non-fatal in CI)"
          "$BIN" list --json || true
          MCP_PORTAL_TUI_TEST_MODE=1 MCP_PORTAL_TUI_KEYS='r,q' CI='' "$BIN" tui
          BYTES=$(node -e "const fs=require('fs'); console.log(fs.statSync(process.argv[1]).size)" "$BIN")
          echo "Binary size: $BYTES bytes"
          test "$BYTES" -lt 250000000
          echo "Smoke passed"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}
          path: dist-bin/${{ matrix.binary-name }}${{ matrix.ext }}
          retention-days: 7

  # ── Job 3: npm publish (runs after binaries build in parallel) ───────────────
  publish-npm:
    needs: [prepare-release]
    if: |
      needs.prepare-release.result == 'success' &&
      github.event.inputs.release_type != 'beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun (for build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (tsc → dist/)
        run: bun run build

      - name: Verify dist/ output
        run: |
          test -f dist/index.js || (echo "dist/index.js missing after build" && exit 1)
          echo "dist/ verified"
          ls dist/ | head -5

      - name: Run tests
        run: bun test
        continue-on-error: true

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          echo "Publishing hoolix@$VERSION to npm..."
          npm publish --access public --provenance
          echo "Published hoolix@$VERSION"

  # ── Job 4: attach binaries + checksums + GPG sigs to GitHub Release ──────────
  attach-release-assets:
    needs: [prepare-release, build-binaries]
    if: needs.prepare-release.result == 'success' && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: ./dist-bin
          merge-multiple: true

      - name: List downloaded binaries
        run: ls -lh ./dist-bin/

      - name: Generate SHA-256 checksums
        run: |
          cd dist-bin
          # Generate checksums for all platform binaries
          sha256sum hoolix-linux-x64 hoolix-linux-arm64 hoolix-darwin-arm64 hoolix-windows-x64.exe > SHA256SUMS 2>/dev/null || \
          shasum -a 256 hoolix-linux-x64 hoolix-linux-arm64 hoolix-darwin-arm64 hoolix-windows-x64.exe > SHA256SUMS 2>/dev/null || true
          echo ""
          echo "SHA256SUMS:"
          cat SHA256SUMS || echo "(no checksums generated)"
          mv SHA256SUMS ../SHA256SUMS || true

      - name: Import GPG key (optional — only if secret is set)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        continue-on-error: true

      - name: GPG-sign binaries (optional)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set +e
          echo "Signing binaries with GPG..."
          for f in dist-bin/hoolix-linux-x64 dist-bin/hoolix-linux-arm64 dist-bin/hoolix-darwin-arm64 dist-bin/hoolix-windows-x64.exe; do
            if [ -f "$f" ]; then
              gpg --batch --yes --armor --detach-sign "$f" && echo "Signed: $f" || echo "GPG sign failed for $f (non-fatal)"
            fi
          done
          ls -la dist-bin/*.asc 2>/dev/null || echo "No GPG signatures produced"
          set -e
        continue-on-error: true

      - name: Collect all release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist-bin/hoolix-linux-x64 release-assets/ 2>/dev/null || true
          cp dist-bin/hoolix-linux-arm64 release-assets/ 2>/dev/null || true
          cp dist-bin/hoolix-darwin-arm64 release-assets/ 2>/dev/null || true
          cp dist-bin/hoolix-windows-x64.exe release-assets/ 2>/dev/null || true
          cp dist-bin/*.asc release-assets/ 2>/dev/null || true
          cp SHA256SUMS release-assets/ 2>/dev/null || true
          echo ""
          echo "Release assets:"
          ls -lh release-assets/

      - name: Attach all assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: release-assets/*
          prerelease: ${{ github.event.inputs.release_type == 'beta' }}
          append_body: true
          body: |

            ---

            ## Verification

            ### SHA-256 checksums
            Download `SHA256SUMS` and verify:
            ```bash
            # Linux / macOS
            sha256sum --check SHA256SUMS

            # macOS (shasum)
            shasum -a 256 -c SHA256SUMS
            ```

            ### npm (recommended — no signature needed)
            ```bash
            npm install -g hoolix
            ```
            npm packages are verified via [npm provenance](https://docs.npmjs.com/generating-provenance-statements).

            ### Binary install (Linux / macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/JayLLM/hoolix/main/install.sh | bash
            ```

            ### Binary install (Windows)
            ```powershell
            iwr -useb https://raw.githubusercontent.com/JayLLM/hoolix/main/install.ps1 | iex
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
