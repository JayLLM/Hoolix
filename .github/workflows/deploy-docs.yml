name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docs
        run: npm install

      - name: Build documentation site
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  # Deploy job
  deploy:
    # Grant the necessary permissions for the official deploy action to work with GitHub Pages + OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Notes for repo admin (one-time setup):
# 1. Go to repo Settings > Pages and set "Source" / "Build and deployment" > "GitHub Actions" (not a branch).
# 2. The first successful run will create the "github-pages" environment (you may need to approve it the first time).
# 3. This workflow uses the official artifact-based deploy (no gh-pages branch push from the action).
# 4. The Docusaurus baseUrl is set to /hoolix/ which matches the project pages URL https://<org>.github.io/hoolix/
# 5. Do not use `npm run deploy` from the docs/ folder for CI (it is the legacy gh-pages based deploy and would require additional secrets).